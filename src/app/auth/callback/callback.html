<ng-container ngNonBindable>
<svg class="arcs arcs--tr" viewBox="0 0 360 400" aria-hidden="true" data-arcs>
  <g fill="none">
    <path d="M186 -10V200A174 174 0 0 0 360 374H370" stroke="var(--color-ink)" stroke-width="52"/>
    <path d="M186 -10V200A174 174 0 0 0 360 374H370" stroke="var(--color-pan-teal)" stroke-width="48"/>
    <path d="M238 -10V200A122 122 0 0 0 360 322H370" stroke="var(--color-ink)" stroke-width="52"/>
    <path d="M238 -10V200A122 122 0 0 0 360 322H370" stroke="var(--color-butter)" stroke-width="48"/>
    <path d="M290 -10V200A70 70 0 0 0 360 270H370" stroke="var(--color-ink)" stroke-width="52"/>
    <path d="M290 -10V200A70 70 0 0 0 360 270H370" stroke="var(--color-tomato)" stroke-width="48"/>
  </g>
</svg>
<svg class="arcs arcs--bl" viewBox="0 0 210 420" aria-hidden="true" data-arcs>
  <g fill="none">
    <path d="M-10 26H0A174 174 0 0 1 174 200V430" stroke="var(--color-ink)" stroke-width="52"/>
    <path d="M-10 26H0A174 174 0 0 1 174 200V430" stroke="var(--color-tomato)" stroke-width="48"/>
    <path d="M-10 78H0A122 122 0 0 1 122 200V430" stroke="var(--color-ink)" stroke-width="52"/>
    <path d="M-10 78H0A122 122 0 0 1 122 200V430" stroke="var(--color-butter)" stroke-width="48"/>
    <path d="M-10 130H0A70 70 0 0 1 70 200V430" stroke="var(--color-ink)" stroke-width="52"/>
    <path d="M-10 130H0A70 70 0 0 1 70 200V430" stroke="var(--color-pan-teal)" stroke-width="48"/>
  </g>
</svg>

<header class="auth__top">
  <a class="brand" href="/" aria-label="BeepBite home"><svg data-logo class="logo-mark"></svg>beepbite</a>
</header>

<main class="cb" aria-live="polite">
  <div class="cb__stage">
    <div class="cb__rings" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <svg class="cb__face" viewBox="0 0 200 200" role="img" aria-label="BeepBite mascot" data-face="happy">
      <circle cx="100" cy="100" r="90" fill="var(--cb-disc)" mask="url(#bite-full)"/>
      <circle cx="100" cy="100" r="89" fill="none" stroke="var(--color-ink)" stroke-width="3" mask="url(#bite-full)"/>
      <g class="face" fill="none" stroke="var(--color-ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <g class="f-happy"><path d="M56 112q10-12 20 0M92 112q10-12 20 0"/><path d="M58 128Q84 166 110 128Z" fill="var(--color-ink)" stroke-width="5"/></g>
        <g class="f-smile"><circle cx="66" cy="110" r="8" fill="var(--color-ink)" stroke="none"/><path d="M92 110q10-9 20 0"/><path d="M64 134Q84 150 104 134"/></g>
        <g class="f-sleepy"><path d="M56 112q10 9 20 0M92 112q10 9 20 0"/><circle cx="84" cy="140" r="6" fill="var(--color-ink)" stroke="none"/></g>
        <g class="f-hmm"><circle cx="66" cy="110" r="8" fill="var(--color-ink)" stroke="none"/><circle cx="102" cy="110" r="8" fill="var(--color-ink)" stroke="none"/><path d="M56 92l18 6M112 92l-18 6"/><path d="M68 138h32"/></g>
        <g class="f-worried"><circle cx="66" cy="112" r="8" fill="var(--color-ink)" stroke="none"/><circle cx="102" cy="112" r="8" fill="var(--color-ink)" stroke="none"/><path d="M56 96l16-6M112 96l-16-6"/><path d="M66 144q18-14 36 0"/><path d="M128 84q6 10 0 14q-6-4 0-14z" fill="#8FD3FF" stroke-width="3"/></g>
      </g>
    </svg>
    <span class="speech speech--butter cb__speech" data-speech>Beep! Welcome back</span>
    <span class="sticker cb__sticker" aria-hidden="true"><span>Fresh<br>code<br>(beep)</span></span>
  </div>

  <span class="label" data-label>Signed in</span>
  <h1 data-title>Hi, Lina.</h1>
  <p class="cb__text" data-text>Getting your code ready…</p>
  <ul class="cb__steps" data-steps></ul>

  <div class="cb__progress" data-progress hidden><span></span></div>
  <p class="cb__go" data-go hidden>Taking you there… <a href="#" data-go-link>Go now</a></p>

  <div class="cb__actions" data-actions></div>
</main>

</ng-container>
