<ng-container ngNonBindable>

    <path d="M186 -10V200A174 174 0 0 0 360 374H370" stroke="var(--color-ink)" stroke-width="52"/>
    <path d="M186 -10V200A174 174 0 0 0 360 374H370" stroke="var(--color-pan-teal)" stroke-width="48"/>
    <path d="M238 -10V200A122 122 0 0 0 360 322H370" stroke="var(--color-ink)" stroke-width="52"/>
    <path d="M238 -10V200A122 122 0 0 0 360 322H370" stroke="var(--color-butter)" stroke-width="48"/>
    <path d="M290 -10V200A70 70 0 0 0 360 270H370" stroke="var(--color-ink)" stroke-width="52"/>
    <path d="M290 -10V200A70 70 0 0 0 360 270H370" stroke="var(--color-tomato)" stroke-width="48"/>

<svg class="arcs arcs--bl" viewBox="0 0 210 420" aria-hidden="true" data-arcs>
  <g fill="none">
    <path d="M-10 26H0A174 174 0 0 1 174 200V430" stroke="var(--color-ink)" stroke-width="52"/>
    <path d="M-10 26H0A174 174 0 0 1 174 200V430" stroke="var(--color-tomato)" stroke-width="48"/>
    <path d="M-10 78H0A122 122 0 0 1 122 200V430" stroke="var(--color-ink)" stroke-width="52"/>
    <path d="M-10 78H0A122 122 0 0 1 122 200V430" stroke="var(--color-butter)" stroke-width="48"/>
    <path d="M-10 130H0A70 70 0 0 1 70 200V430" stroke="var(--color-ink)" stroke-width="52"/>
    <path d="M-10 130H0A70 70 0 0 1 70 200V430" stroke="var(--color-pan-teal)" stroke-width="48"/>

<header class="auth__top">
  <a class="brand" href="/" data-transition aria-label="BeepBite home"><svg data-logo class="logo-mark"></svg>beepbite</a>

</header>

<main class="auth__main">
  <div class="auth__wrap" data-card>
    <section class="auth__card" aria-labelledby="title">
      <div class="auth__head">
        <span class="label" style="color:var(--color-tomato)">New password</span>
        <h1 id="title">Pick a new password.</h1>
        <p>Choose one you haven't used here before. You'll sign in with it straight after.</p>
      </div>

      <div class="alert" role="alert" data-alert-error hidden><svg data-icon="alert"></svg><span data-error-text></span></div>

      <form class="auth__form" novalidate data-form>
        <div class="field" data-field="password">
          <label class="field__label" for="password">New password</label>
          <div class="field__control">
            <svg data-icon="lock"></svg>
            <input class="field__input" id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" aria-describedby="password-hint password-error" required>
            <button class="field__toggle" type="button" aria-label="Show password" aria-pressed="false" data-password-toggle></button>
          </div>
          <p class="field__hint" id="password-hint">At least 8 characters.</p>
          <p class="inline-error" id="password-error" hidden></p>
        </div>

        <button class="btn btn--primary btn--block" type="submit" data-submit>Save new password</button>
      </form>

      <p class="auth__switch">Link not working? <a href="/forgot-password" data-transition>Send a new one</a></p>
    </section>
    <a class="auth__back" href="/login" data-transition><svg data-icon="back" class="icon--sm"></svg>Back to sign in</a>
  </div>
</main>

</ng-container>
